<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>Email → LinkedIn</title>
<style>
  body { width: 320px; margin: 0; padding: 14px; font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; color: #1f2937; background: #fff; }
  h1 { font-size: 14px; margin: 0 0 10px; } label { display: block; font-size: 12px; color: #6b7280; margin-top: 10px; }
  input[type=text], input[type=password] { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 6px; font: inherit; margin-top: 3px; }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 10px; } .row label { margin: 0; color: inherit; }
  button { font: inherit; font-size: 12px; padding: 6px 12px; border-radius: 6px; border: 1px solid #4f46e5; background: #4f46e5; color: #fff; cursor: pointer; }
  button.ghost { background: #fff; color: #4f46e5; }
  .status { margin-top: 10px; font-size: 12px; color: #6b7280; min-height: 18px; } .ok { color: #166534; } .err { color: #991b1b; }
  .hint { font-size: 11px; color: #9ca3af; margin-top: 8px; } a { color: #4f46e5; }
  @media (prefers-color-scheme: dark) { body { background: #111827; color: #e5e7eb; } input { background: #1f2937; color: #e5e7eb; border-color: #374151; } button.ghost { background: #111827; } }
</style></head>
<body>
  <h1>Email → LinkedIn</h1>
  <label>服务器地址<input type="text" id="serverUrl" placeholder="http://127.0.0.1:3390" spellcheck="false"></label>
  <label>令牌（APP_TOKEN）<input type="password" id="token" placeholder="粘贴 .env 里的 APP_TOKEN" spellcheck="false"></label>
  <div class="row"><input type="checkbox" id="autoLookup"><label for="autoLookup">打开邮件时自动查找（会产生费用）</label></div>
  <div class="row"><input type="checkbox" id="showCost" checked><label for="showCost">在卡片上显示费用</label></div>
  <div class="row"><button id="save">保存</button><button id="test" class="ghost">测试连接</button><a id="open" href="#" target="_blank" style="margin-left:auto">打开网页版</a></div>
  <div class="status" id="status"></div>
  <div class="hint">默认打开邮件时自动查找；取消勾选后改为手动点击“查 LinkedIn”。令牌只保存在本机扩展存储中，不会传给邮箱页面。</div>
  <script src="popup.js"></script>
</body></html>
